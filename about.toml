# Order selects MIT when a crate offers MIT OR Apache-2.0.
accepted = ["MIT", "BSD-3-Clause", "Apache-2.0", "Unicode-3.0", "Zlib"]
# Include build, development, and target-specific dependencies for portable notices.
ignore-build-dependencies = false
ignore-dev-dependencies = false

# Explicit, checksum-verified sources prevent canonical MIT text from replacing
# upstream attribution. Git sources use each package's .cargo_vcs_info.json
# revision, not a moving branch. Keep full combined notices where applicable.
[nine_dev_site_build.clarify]
license = "BSD-3-Clause"
[[nine_dev_site_build.clarify.files]]
path = "LICENSE"
license = "BSD-3-Clause"
checksum = "c40576f6cf22188597b6f507457300c69a210ce0a6f2369b5e2d141bb4fe8831"


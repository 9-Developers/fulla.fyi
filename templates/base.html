<!DOCTYPE html>
<html lang="en" data-theme="latte">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Share wishlists with your friends">
  <title>{{ title }} | Fulla</title>
  <link rel="icon" href="{{ crate::static_assets::static_url("favicon.ico") }}" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="{{ crate::static_assets::static_url("icon-180.png") }}" sizes="180x180">
  <link rel="manifest" href="{{ crate::static_assets::static_url("site.webmanifest") }}">
  <script src="{{ nine_dev_site_lib::switcher::JS.url }}"></script>
  <link rel="stylesheet" href="{{ nine_dev_site_lib::assets::theme::PALETTE.url }}">
  <link rel="stylesheet" href="{{ crate::static_assets::static_url("main.css") }}">
  <link rel="stylesheet" href="{{ nine_dev_site_lib::switcher::CSS.url }}">
  <script src="{{ nine_dev_site_lib::assets::htmx::JS.url }}"></script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <div class="header-inner">
      <h1>
        <a href="/">Fulla</a>
      </h1>

      <nav aria-label="Main navigation">
        <a href="/account">Your account</a>
      </nav>

      <div class="settings">
        {{ nine_dev_site_lib::switcher::ThemeSwitcher::default()|safe }}
        {% block auth_links %}<a href="/login">Log in</a><a class="signup" href="/register">Sign up</a>{% endblock %}
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">{% block content %} {% endblock %}</main>

  <footer>
    <a href="/licenses">Open-source licenses</a>
  </footer>

</body>

</html>

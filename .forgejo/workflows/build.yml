name: Build

on:
  pull_request:
  workflow_call:

jobs:
  licenses:
    name: Dependency licenses
    runs-on: ci-rust
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install license tools
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          cargo install cargo-deny --version 0.21.0 --locked

      - name: Check license policy
        run: cargo deny --locked check licenses

      - name: Check generated notices
        run: |
          cargo about generate --locked --fail licenses/rust.hbs -o "$RUNNER_TEMP/rust-licenses.txt"
          sh .forgejo/scripts/check-license-notices.sh "$RUNNER_TEMP/rust-licenses.txt"
          diff -u licenses/rust.txt "$RUNNER_TEMP/rust-licenses.txt"

  rust:
    name: Rust build
    runs-on: ci-rust
    timeout-minutes: 20

    env:
      DATABASE_URL: postgres://fulla_test:fulla_test@postgres:5432/fulla_fyi

    services:
      postgres:
        image: git.9dev.tech/9-developers/ci-postgres:18
        env:
          POSTGRES_USER: fulla_test
          POSTGRES_PASSWORD: fulla_test
          POSTGRES_DB: fulla_fyi

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install build and telemetry test tools
        run: |
          pkg install -y python3 devel/py-opentelemetry-proto
          npm install --no-save --no-package-lock @tailwindcss/cli@4.3.5 tailwindcss@4.3.5
          echo "$PWD/node_modules/.bin" >> "$FORGEJO_PATH"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --locked --all-targets

      - name: Build
        run: cargo build --locked

      - name: Check generated CSS
        run: git diff --exit-code --stat -- public/main.css

      - name: Check local OTLP export
        env:
          # Git blob of scripts/check_otlp.py in 9dev-site-lib.
          OTLP_CHECK_BLOB: 616b15cd571f9a155b4299cce14483f8da15275f
        run: |
          git fetch --no-tags --no-write-fetch-head --depth=1 https://git.9dev.tech/9-Developers/9dev-site-lib.git "$OTLP_CHECK_BLOB"
          git cat-file blob "$OTLP_CHECK_BLOB" > "$RUNNER_TEMP/check_otlp.py"
          target/debug/fulla_fyi migrate
          python3 "$RUNNER_TEMP/check_otlp.py" --fulla target/debug/fulla_fyi

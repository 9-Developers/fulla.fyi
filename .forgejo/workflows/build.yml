name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  licenses:
    name: Dependency licenses
    runs-on: ci-rust
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install license tools
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          cargo install cargo-deny --version 0.21.0 --locked

      - name: Check license policy
        run: cargo deny --locked check licenses

      - name: Check generated notices
        run: |
          cargo about generate --locked --fail licenses/rust.hbs -o "$RUNNER_TEMP/rust-licenses.txt"
          sh .forgejo/scripts/check-license-notices.sh "$RUNNER_TEMP/rust-licenses.txt"
          diff -u licenses/rust.txt "$RUNNER_TEMP/rust-licenses.txt"

  railway-config:
    name: Railway configuration
    runs-on: ci-go
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Check Railway configuration
        working-directory: .railway
        run: |
          test -z "$(gofmt -l .)"
          go mod download
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly ./...

      - name: Test deployment gates
        run: node --test .forgejo/scripts/deploy.test.mjs

  rust:
    name: Rust build
    runs-on: ci-rust
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fulla_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:fulla_test@postgres:5432/postgres
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install Tailwind CSS
        run: |
          npm install --no-save --no-package-lock @tailwindcss/cli@4.3.3 tailwindcss@4.3.3
          echo "$PWD/node_modules/.bin" >> "$FORGEJO_PATH"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build
        run: cargo build --locked

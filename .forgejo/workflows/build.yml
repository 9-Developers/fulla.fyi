name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  rust:
    name: Rust build
    runs-on: node24
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install Rust
        run: |
          apt -o APT::Cache-Start=100000000 update -q
          apt -o APT::Cache-Start=100000000 install -q -y rustup

      - name: Install Tailwind CSS
        run: |
          npm install --no-save --no-package-lock @tailwindcss/cli@4.3.3 tailwindcss@4.3.3
          echo "$PWD/node_modules/.bin" >> "$FORGEJO_PATH"

      - name: Cargo check
        run: cargo check

      - name: Clippy
        run: cargo clippy

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked

name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  railway-config:
    name: Railway configuration
    runs-on: node24
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install Go
        uses: https://github.com/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false

      - name: Check Railway configuration
        working-directory: .railway
        run: |
          test -z "$(gofmt -l .)"
          go mod download
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly ./...

      - name: Test deployment gates
        run: node --test .forgejo/scripts/deploy.test.mjs

  rust:
    name: Rust build
    runs-on: node24
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install Rust
        run: |
          apt -o APT::Cache-Start=100000000 update -q
          apt -o APT::Cache-Start=100000000 install -q -y rustup

      - name: Install Tailwind CSS
        run: |
          npm install --no-save --no-package-lock @tailwindcss/cli@4.3.3 tailwindcss@4.3.3
          echo "$PWD/node_modules/.bin" >> "$FORGEJO_PATH"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build
        run: cargo build --locked

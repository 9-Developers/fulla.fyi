name: Railway image deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

concurrency:
  group: railway-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  railway:
    runs-on: ci-railway
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install Go for Railway configuration
        uses: https://github.com/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false

      - name: Promote image and verify health
        run: bash .forgejo/scripts/release.sh
        env:
          RAILWAY_ENVIRONMENT: ${{ inputs.environment }}
          RAILWAY_SERVICE: fulla.fyi
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          RELEASE_RUN_ID: ${{ forgejo.run_id }}

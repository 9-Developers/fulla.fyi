[package]
name = "fulla_fyi"
version = "0.1.3"
edition = "2024"
authors = ["Ryan Porterfield <ixirsii@9dev.tech>"]
description = "Share wishlists with your friends"
license = "BSD-3-Clause"
repository = "https://codeberg.org/9-Developers/fulla.fyi"
readme = "README.md"
keywords = ["axum", "htmx", "social", "web", "wishlist"]
categories = ["web-programming"]

[build-dependencies]
nine_dev_site_build = "0.2.1"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
askama = "0.16.0"
axum = "0.8.9"
axum-htmx = "0.8.1"
axum-login = "0.18.0"
include_dir = "0.7.4"
nine_dev_site_lib = { version = "0.7", features = [
  "axum",
  "htmx",
  "startup",
  "telemetry",
] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
time = "0.3.55"
sqlx = { version = "0.9.0", features = [
  "chrono",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "tls-native-tls",
] }
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
zxcvbn = "3.1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
expect_used = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"
unwrap_used = "deny"

[dev-dependencies]
sha2 = "0.11.0"
tower = { version = "0.5.3", features = ["util"] }
serde_urlencoded = "0.7.1"

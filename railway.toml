[build]
builder = "RAILPACK"
buildCommand = "cargo build --release --locked && cp target/release/fulla_fyi fulla_fyi"
watchPatterns = [
    "src/**",
    "templates/**",
    "migrations/**",
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "railpack.json",
    "railway.toml",
    "rust-toolchain.toml",
]

[deploy]
startCommand = "./fulla_fyi"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
